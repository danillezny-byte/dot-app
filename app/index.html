<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F5F7">
<title>dot.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --text: #111;
    --sub: rgba(60,60,67,0.6);
    --line: rgba(60,60,67,0.12);
    --chip: rgba(0,0,0,0.04);
    --accent: #6D3CF0;
    --accent-soft: rgba(109,60,240,0.12);
  }
  html, body, #root {
    margin: 0; padding: 0;
    height: 100dvh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow: hidden;
  }
  @supports not (height: 100dvh) {
    html, body, #root { height: 100vh; min-height: 100vh; }
  }
  *  { box-sizing: border-box; }
  #root {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
