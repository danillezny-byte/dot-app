<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent: статус-бар iOS становится прозрачным, контент уходит под него.
     Сафари сам подкрашивает текст под фон через safe-area-inset-top. Ощущается нативно. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="dot.">
<meta name="theme-color" content="#F5F5F7">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
<title>dot. — задачи, привычки и база знаний</title>
<meta name="description" content="Минималистичный таск-менеджер с привычками и базой знаний. Тихо, по-человечески, без лишнего шума.">

<!-- OpenGraph: что показывается в превью когда ссылку кидают в Telegram, iMessage, Discord, Slack -->
<meta property="og:type" content="website">
<meta property="og:title" content="dot. — задачи, привычки и база знаний">
<meta property="og:description" content="Минималистичный таск-менеджер с привычками и базой знаний. Тихо, по-человечески, без лишнего шума.">
<meta property="og:url" content="https://dot-app-gold.vercel.app/">
<meta property="og:image" content="https://dot-app-gold.vercel.app/pwa-512x512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="dot.">

<!-- Twitter Card (тот же набор, но Twitter/X читает свои теги) -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="dot. — задачи, привычки и база знаний">
<meta name="twitter:description" content="Минималистичный таск-менеджер с привычками и базой знаний.">
<meta name="twitter:image" content="https://dot-app-gold.vercel.app/pwa-512x512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --text: #111;
    --sub: rgba(60,60,67,0.6);
    --line: rgba(60,60,67,0.12);
    --chip: rgba(0,0,0,0.04);
    --accent: #6D3CF0;
    --accent-soft: rgba(109,60,240,0.12);
  }
  html, body, #root {
    margin: 0; padding: 0;
    height: 100dvh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow: hidden;
  }
  @supports not (height: 100dvh) {
    html, body, #root { height: 100vh; min-height: 100vh; }
  }
  *  { box-sizing: border-box; }
  #root {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
