<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --text: #111;
    --sub: rgba(60,60,67,0.6);
    --line: rgba(60,60,67,0.12);
    --chip: rgba(0,0,0,0.04);
    --accent: #6D3CF0;
    --accent-soft: rgba(109,60,240,0.12);
  }
  html, body, #root {
    margin: 0; padding: 0;
    height: 100dvh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow: hidden;
  }
  @supports not (height: 100dvh) {
    html, body, #root { height: 100vh; min-height: 100vh; }
  }
  *  { box-sizing: border-box; }
  #root {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    flex-direction: column;
  }
  /* Skeleton-shimmer для loading-состояний (TasksView/HabitsView/BaseTreeView).
     Лёгкая бегущая полоса по серой плашке, как в iOS-навёрстке. */
  @keyframes dot-shimmer {
    0%   { background-position: -400px 0; }
    100% { background-position:  400px 0; }
  }
  .dot-skeleton {
    background-color: var(--chip);
    background-image: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.45) 50%, transparent 100%);
    background-size: 400px 100%;
    background-repeat: no-repeat;
    animation: dot-shimmer 1.4s ease-in-out infinite;
    border-radius: 8px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
