<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F5F7">
<title>dot.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --text: #111;
    --sub: rgba(60,60,67,0.6);
    --line: rgba(60,60,67,0.12);
    --chip: rgba(0,0,0,0.04);
    --accent: #6D3CF0;
    --accent-soft: rgba(109,60,240,0.12);
  }
  html, body, #root {
    margin: 0; padding: 0;
    height: 100dvh; /* динамическая высота — не прыгает с клавиатурой на iOS */
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow: hidden;
  }
  /* На случай старых iOS (Safari < 15.4) — фолбэк */
  @supports not (height: 100dvh) {
    html, body, #root { height: 100vh; min-height: 100vh; }
  }
  *  { box-sizing: border-box; }
  #root {
    /* Учитываем нотч и нижнюю safe area (iOS PWA) */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    flex-direction: column;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="dot/tokens.jsx"></script>
<script type="text/babel" src="dot/live.jsx"></script>
<script type="text/babel" src="dot/icons.jsx"></script>
<script type="text/babel" src="dot/phone.jsx"></script>
<script type="text/babel" src="dot/keyboard.jsx"></script>
<script type="text/babel" src="dot/composers.jsx"></script>
<script type="text/babel" src="dot/settings.jsx"></script>
<script type="text/babel" src="dot/auth.jsx"></script>
<script type="text/babel" src="dot/onboarding.jsx"></script>
<script type="text/babel" src="dot/app-screens.jsx"></script>
<script type="text/babel" src="dot/flow-diagram.jsx"></script>
<script type="text/babel" src="dot/composer-variants.jsx"></script>
<script type="text/babel" src="dot/settings-deep.jsx"></script>
<script type="text/babel" src="dot/settings-deep2.jsx"></script>
<script type="text/babel" src="dot/task-pickers.jsx"></script>
<script type="text/babel" src="dot/habit-pickers.jsx"></script>
<script type="text/babel" src="dot/profile-screens.jsx"></script>
<script type="text/babel" src="dot/verify-email.jsx"></script>
<script type="text/babel" src="dot/note-editor.jsx"></script>
<script type="text/babel" src="dot/note-blocks.jsx"></script>

<script type="text/babel">
  const { useState } = React;

  // Только живой экран — без figma-канваса, без бутафорского телефона.
  // Контент сразу рендерится во весь viewport.
  function LiveApp() {
    const [screen, setScreen] = useState('login');
    // На какую вкладку Home возвращать после под-экрана (профиль/настройки).
    // Дефолт — из настроек «Стартовый экран» в localStorage.
    const [homeTab, setHomeTab] = useState(localStorage.getItem('dot-start-tab') || 'tasks');

    // Перехватываем 'migration' (моковые цифры — пропускаем) и помечаем
    // профильные/настройки экраны как «вернуться на вкладку Профиль».
    const goTo = (s) => {
      if (s === 'migration') return setScreen('home');
      const isProfileSub = s === 'profile-edit' || s === 'profile-sub' || s === 'profile-help' || s === 'settings' || s === 'plans';
      if (isProfileSub) setHomeTab('me');
      setScreen(s);
    };
    const props = { onGo: goTo, live: true };

    React.useEffect(() => {
      if (!window.live) return;
      window.live.getUser().then((user) => {
        if (user && (screen === 'login' || screen === 'register')) setScreen('home');
      });
    }, []);

    const back = () => setScreen('home');
    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, position: 'relative', overflowY: 'auto' }}>
        {screen === 'login'        && <Login {...props} />}
        {screen === 'register'     && <Register {...props} />}
        {screen === 'reset'        && <Reset {...props} />}
        {screen === 'onboarding'   && <Onboarding {...props} />}
        {screen === 'migration'    && <Migration {...props} />}
        {screen === 'home'         && <Home {...props} initialTab={homeTab} key={homeTab} />}
        {screen === 'plans'        && <Plans {...props} />}
        {screen === 'profile-edit' && <ProfileEdit live onBack={back} />}
        {screen === 'profile-sub'  && <SubscriptionManage onBack={back} />}
        {screen === 'profile-help' && <HelpSupport onBack={back} />}
        {screen === 'settings'     && <SettingsLive onBack={back} />}
      </div>
    );
  }

  // Settings со встроенной навигацией: index ↔ detail
  function SettingsLive({ onBack }) {
    const [id, setId] = useState('index');
    if (id === 'index') {
      return (
        <div style={{ flex: 1, overflowY: 'auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '12px 24px' }}>
            <button onClick={onBack} style={{ background: 'none', border: 'none', padding: 0, color: 'var(--text)', cursor: 'pointer', display: 'flex' }}>
              <IconChevronLeft size={22} strokeWidth={1.75} />
            </button>
            <div style={{ fontSize: 18, fontWeight: 600 }}>Настройки</div>
          </div>
          <SettingsIndex onEnter={(rowId) => setId(rowId)} />
        </div>
      );
    }
    return (
      <div style={{ flex: 1, overflowY: 'auto' }}>
        <SettingsDetail id={id} onBack={() => setId('index')} />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<LiveApp />);
</script>
</body>
</html>
